<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바이브코딩 클래스 허브</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f8fafc;
    min-height: 100vh;
  }

  /* ── 홈 화면 ── */
  #home-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    padding: 2rem;
  }
  .hub-header {
    text-align: center;
    margin-bottom: 3rem;
  }
  .hub-badge {
    display: inline-block;
    background: rgba(139,92,246,.15);
    color: #a78bfa;
    font-size: .85rem;
    font-weight: 600;
    padding: .4rem 1rem;
    border-radius: 9999px;
    margin-bottom: 1rem;
    border: 1px solid rgba(139,92,246,.25);
  }
  .hub-title {
    font-size: 2.5rem;
    font-weight: 800;
    color: #f1f5f9;
    margin-bottom: .75rem;
    letter-spacing: -0.02em;
  }
  .hub-subtitle {
    font-size: 1.1rem;
    color: #94a3b8;
    font-weight: 400;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 2rem;
    max-width: 800px;
    width: 100%;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 1.25rem;
    padding: 2.5rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: all .3s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    border-radius: 1.25rem 1.25rem 0 0;
  }
  .card.violet::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
  .card.teal::before   { background: linear-gradient(90deg, #14b8a6, #2dd4bf); }

  .card:hover {
    transform: translateY(-6px);
    border-color: #475569;
    box-shadow: 0 20px 40px rgba(0,0,0,.3);
  }
  .card-icon {
    width: 72px; height: 72px;
    border-radius: 1rem;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
    font-size: 2rem;
  }
  .card.violet .card-icon { background: rgba(139,92,246,.15); }
  .card.teal   .card-icon { background: rgba(20,184,166,.15);  }

  .card-title {
    font-size: 1.35rem;
    font-weight: 700;
    color: #f1f5f9;
    margin-bottom: .5rem;
  }
  .card-desc {
    font-size: .95rem;
    color: #94a3b8;
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }
  .card-btn {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    padding: .65rem 1.5rem;
    border-radius: .75rem;
    font-weight: 600;
    font-size: .95rem;
    border: none;
    cursor: pointer;
    transition: all .2s;
  }
  .card.violet .card-btn {
    background: rgba(139,92,246,.15);
    color: #a78bfa;
  }
  .card.violet .card-btn:hover { background: rgba(139,92,246,.25); }
  .card.teal .card-btn {
    background: rgba(20,184,166,.15);
    color: #2dd4bf;
  }
  .card.teal .card-btn:hover { background: rgba(20,184,166,.25); }

  /* ── 콘텐츠 뷰 ── */
  #content-view {
    display: none;
    width: 100%;
    height: 100vh;
    position: relative;
  }
  #content-view.active {
    display: flex;
    flex-direction: column;
  }

  .top-bar {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: .75rem 1.5rem;
    background: #0f172a;
    border-bottom: 1px solid #1e293b;
    flex-shrink: 0;
  }
  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    background: rgba(139,92,246,.12);
    color: #a78bfa;
    border: 1px solid rgba(139,92,246,.25);
    padding: .5rem 1.1rem;
    border-radius: .6rem;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  .home-btn:hover {
    background: rgba(139,92,246,.22);
    border-color: rgba(139,92,246,.4);
  }
  .page-label {
    color: #94a3b8;
    font-size: .9rem;
    font-weight: 500;
  }

  #content-frame {
    flex: 1;
    width: 100%;
    border: none;
    background: #fff;
  }

  .footer-note {
    text-align: center;
    color: #475569;
    font-size: .8rem;
    margin-top: 3rem;
    padding-bottom: 1rem;
  }

  /* 로딩 */
  .loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.85);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 44px; height: 44px;
    border: 3px solid #334155;
    border-top-color: #a78bfa;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: #94a3b8; font-size: .95rem; }
</style>
</head>
<body>

<!-- 홈 화면 -->
<div id="home-view">
  <div class="hub-header">
    <span class="hub-badge">VIBE CODING CLASS</span>
    <h1 class="hub-title">바이브코딩 클래스</h1>
    <p class="hub-subtitle">AI와 함께 만드는 나만의 웹 서비스</p>
  </div>

  <div class="card-grid">
    <div class="card violet" onclick="openPage('startup')">
      <div class="card-icon">🚀</div>
      <h2 class="card-title">창업유형 테스트</h2>
      <p class="card-desc">나에게 맞는 창업 유형을 찾아보는<br>심리테스트 웹앱 만들기</p>
      <button class="card-btn">시작하기 →</button>
    </div>

    <div class="card teal" onclick="openPage('namecard')">
      <div class="card-icon">💼</div>
      <h2 class="card-title">디지털 명함 만들기</h2>
      <p class="card-desc">QR코드가 포함된 나만의<br>디지털 명함 웹앱 만들기</p>
      <button class="card-btn">시작하기 →</button>
    </div>
  </div>

  <p class="footer-note">© 2025 바이브코딩 클래스 · Powered by AI</p>
</div>

<!-- 콘텐츠 뷰 -->
<div id="content-view">
  <div class="top-bar">
    <button class="home-btn" onclick="goHome()">← 홈으로</button>
    <span class="page-label" id="page-label"></span>
  </div>
  <iframe id="content-frame"></iframe>
</div>

<!-- 로딩 -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <span class="loading-text">페이지를 불러오는 중...</span>
</div>

var PAGE_LABELS = {
  startup: "🚀 창업유형 테스트 가이드",
  namecard: "💼 디지털 명함 만들기 가이드"
};

// base64 → UTF-8 문자열
function decodeBase64Utf8(b64) {
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  if (window.TextDecoder) return new TextDecoder('utf-8').decode(bytes);
  return decodeURIComponent(escape(bin)); // 구형 브라우저 폴백
}

var loadTimer = null;

function openPage(key) {
  var data = PAGE_DATA[key];
  var loading = document.getElementById('loading');

  if (!data) {
    alert('해당 페이지를 찾을 수 없습니다: ' + key);
    return;
  }

  loading.classList.add('show');

  setTimeout(function() {
    var frame = document.getElementById('content-frame');
    try {
      var html = decodeBase64Utf8(data);

      // 로딩 해제 핸들러를 콘텐츠 지정 "전에" 연결한다.
      // (src 지정 후에 붙이면 onload를 놓쳐 스피너가 계속 돌 수 있음)
      var done = function() {
        clearTimeout(loadTimer);
        loading.classList.remove('show');
      };
      frame.onload = done;
      frame.onerror = done;
      clearTimeout(loadTimer);
      loadTimer = setTimeout(done, 5000); // 안전장치: 어떤 경우에도 스피너가 남지 않도록

      if ('srcdoc' in frame) {
        // srcdoc 방식 — file:// 로 직접 열어도 정상 동작하고 부모 문서의 출처를 물려받는다
        frame.removeAttribute('src');
        frame.srcdoc = html;
      } else {
        // 아주 오래된 브라우저용 폴백
        frame.removeAttribute('srcdoc');
        frame.src = 'data:text/html;charset=utf-8,' + encodeURIComponent(html);
      }

      document.getElementById('page-label').textContent = PAGE_LABELS[key] || '';
      document.getElementById('home-view').style.display = 'none';
      document.getElementById('content-view').classList.add('active');
      window.scrollTo(0, 0);
    } catch(e) {
      clearTimeout(loadTimer);
      loading.classList.remove('show');
      alert('페이지를 불러오는 중 오류가 발생했습니다: ' + e.message);
    }
  }, 100);
}

function goHome() {
  var frame = document.getElementById('content-frame');
  clearTimeout(loadTimer);
  frame.onload = null;
  frame.onerror = null;
  frame.removeAttribute('srcdoc'); // srcdoc이 남아 있으면 src 지정이 무시된다
  frame.src = 'about:blank';
  document.getElementById('loading').classList.remove('show');
  document.getElementById('content-view').classList.remove('active');
  document.getElementById('home-view').style.display = 'flex';
}
</script>
